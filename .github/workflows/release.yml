# Release workflow for the OpenUSD Geospatial Geometry Plugins source release.
# Tag pushes verify the VERSION, build and test the core libraries, then create
# a draft GitHub release with the source archive and its checksum manifest.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to validate and publish'
        required: true
        type: string

permissions:
  contents: read

env:
  BUILD_DIR: build-release

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          version="$(tr -d '[:space:]' < VERSION)"
          expected="v${version}"
          if [ "$tag" != "$expected" ]; then
            echo "Expected tag $expected, got $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure core build
        run: cmake -S . -B "$BUILD_DIR" -DUSDGEO_BUILD_TESTS=ON -DUSDGEO_BUILD_USD=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build core libraries
        run: cmake --build "$BUILD_DIR" --config Release --parallel

      - name: Run core tests
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure -C Release

      - name: Create source archive and checksum
        id: archive
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          archive="usd-geo-plugins-${VERSION}-src.tar.gz"
          git archive --format=tar.gz --prefix="usd-geo-plugins-${VERSION}/" -o "$archive" "$TAG"
          sha256sum "$archive" > SHA256SUMS
          sha256sum -c SHA256SUMS
          cp "docs/releases/v${VERSION}.md" RELEASE_NOTES.md
          {
            echo
            echo '## Artifacts'
            echo
            echo '| File | Description |'
            echo '| --- | --- |'
            printf '| `%s` | Source archive at tag `%s` |\n' "$archive" "$TAG"
            echo '| `SHA256SUMS` | SHA-256 checksum for every release artifact |'
            echo
            echo '## SHA-256 checksums'
            echo
            echo '```text'
            cat SHA256SUMS
            echo '```'
          } >> RELEASE_NOTES.md
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            ${{ steps.archive.outputs.archive }}
            SHA256SUMS
            RELEASE_NOTES.md

  release:
    name: Assemble draft GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-files

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft > existing.json 2>/dev/null; then
            if [ "$(jq -r .isDraft existing.json)" = "true" ]; then
              gh release delete "$TAG" --yes
            else
              echo "Release $TAG is already published; refusing to replace it" >&2
              exit 1
            fi
          fi
          gh release create "$TAG" \
            --draft \
            --title "OpenUSD Geospatial Geometry Plugins $TAG" \
            --notes-file RELEASE_NOTES.md \
            *.tar.gz SHA256SUMS
