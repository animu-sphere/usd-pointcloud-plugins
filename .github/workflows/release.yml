# Cross-platform release workflow. Tag pushes build all USD FileFormat
# Plugins on Windows, Linux, and macOS, then assemble a draft release.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to validate and build'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  OST_VERSION: '0.22.2'
  OST_REPOSITORY: animu-sphere/open-strata
  OST_PLATFORM: cy2026
  OST_PROFILE: usd

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runs_on: windows-2022
            runner_profile: windows-hosted
            ost_home: ''
            runtime_artifact: sha256:c3ed40122756ea118166e1619efcaec463e7d2a42f6d978fe4e20b6b774c4b03
            runtime_remote: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:07cb84412017ece911adaed1175a6373865d863bc40124081cfc20c52de7f0d9
            host_python: ''
            host_packages_apt: ''
            up_to: 4
          - name: linux-x86_64
            runs_on: ubuntu-24.04
            runner_profile: linux-hosted
            ost_home: .ost-ci-home
            runtime_artifact: sha256:03f7d4ef263abb50511d17237e7cbdbe1b83dee02cff8b8f901f0484c7a7898e
            runtime_remote: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:367a32bd1985ca9b07e8f7e64f95c1ded8dba16d68f17e0bffb09cec0b9dc3f6
            host_python: '3.13'
            host_packages_apt: libx11-dev libxt-dev libxext-dev libgl1-mesa-dev
            up_to: 5
          - name: macos-arm64
            runs_on: macos-15
            runner_profile: macos-arm64-hosted
            ost_home: .ost-ci-home
            runtime_artifact: sha256:a9bb847ab5c7eb29d7425ff9acfb05b01c1751054d6a70628e48b06f8409a4a8
            runtime_remote: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:dc0c980b868f91fe33e6f35a67a2bc5693b89f0243141c55ecb068ab225b0f3e
            host_python: '3.13'
            host_packages_apt: ''
            up_to: 5
    env:
      OST_CI_CELL: pointcloud-${{ matrix.name }}-release
      OST_CI_LANE: release
      OST_CI_RUNNER_PROFILE: ${{ matrix.runner_profile }}
      OST_CI_RUNS_ON: ${{ matrix.runs_on }}
      OST_CI_RUNTIME_ARTIFACT: ${{ matrix.runtime_artifact }}
      OST_CI_MINIMUM_TRUST: local
      OST_HOME: ${{ matrix.name == 'windows-x86_64' && '' || format('{0}/{1}', github.workspace, matrix.ost_home) }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve and validate release tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "v${version}" ]; then
            echo "Expected tag v${version}, got ${tag}" >&2
            exit 1
          fi
          python tools/check_release_metadata.py

      - name: Bootstrap ost
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci/bootstrap-bin
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) triple=x86_64-unknown-linux-musl; ext=tar.xz ;;
            macOS-ARM64) triple=aarch64-apple-darwin; ext=tar.xz ;;
            Windows-X64) triple=x86_64-pc-windows-msvc; ext=zip ;;
            *) echo "Unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          asset="ost-cli-${triple}.${ext}"
          base="https://github.com/${OST_REPOSITORY}/releases/download/v${OST_VERSION}"
          curl -fsSLo "$asset" "$base/$asset"
          curl -fsSLo "$asset.sha256" "$base/$asset.sha256"
          actual="$( (command -v sha256sum > /dev/null && sha256sum "$asset" || shasum -a 256 "$asset") | cut -d' ' -f1 )"
          published="$(cut -d' ' -f1 "$asset.sha256")"
          if [ "$actual" != "$published" ]; then
            echo "ost checksum mismatch for $asset" >&2
            exit 1
          fi
          if [ "$ext" = zip ]; then
            powershell -NoProfile -Command "Expand-Archive -LiteralPath '$asset' -DestinationPath '.ost-ci/bootstrap-bin' -Force"
          else
            tar -xf "$asset" -C .ost-ci/bootstrap-bin
          fi
          bin="$(find .ost-ci/bootstrap-bin -type f \( -name ost -o -name ost.exe \) | head -n 1)"
          if [ -z "$bin" ]; then echo 'ost binary not found' >&2; exit 1; fi
          chmod +x "$bin" 2>/dev/null || true
          bin_dir="$(cd "$(dirname "$bin")" && pwd)"
          if [ "$RUNNER_OS" = Windows ] && command -v cygpath >/dev/null; then
            bin_dir="$(cygpath -w "$bin_dir")"
          fi
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Install Linux host packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          HOST_PACKAGES: ${{ matrix.host_packages_apt }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $HOST_PACKAGES

      - name: Set up host Python
        if: matrix.host_python != ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.host_python }}

      - name: Verify ost and CI contract
        shell: bash
        run: |
          set -euo pipefail
          ost --version
          ost ci validate

      - name: Pull and verify the OpenUSD runtime
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${OST_HOME:-}" ]; then
            mkdir -p "$OST_HOME/artifacts"
          fi
          if ! ost artifact show "$OST_CI_RUNTIME_ARTIFACT" --json >/dev/null 2>&1; then
            ost artifact pull "${{ matrix.runtime_remote }}" \
              --expect-artifact "$OST_CI_RUNTIME_ARTIFACT" --require-kind runtime --json
          fi
          ost artifact verify "$OST_CI_RUNTIME_ARTIFACT" --minimum-trust local
          ost runtime pull "$OST_PLATFORM" --profile "$OST_PROFILE" \
            --from-artifact "$OST_CI_RUNTIME_ARTIFACT" --force
          ost runtime validate "$OST_PLATFORM" --profile "$OST_PROFILE" --json

      - name: Build and test all plugins
        shell: bash
        run: |
          set -euo pipefail
          for bundle in plugins/pointcloud-las plugins/pointcloud-laz plugins/pointcloud-copc plugins/pointcloud-ply; do
            ost plugin build "$bundle" --target "$OST_PLATFORM" --profile "$OST_PROFILE"
            ost plugin test "$bundle" --target "$OST_PLATFORM" --profile "$OST_PROFILE" --up-to "${{ matrix.up_to }}" --json
          done

      - name: Package all plugins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-stage
          ost plugin package --workspace --product --target "$OST_PLATFORM" \
            --profile "$OST_PROFILE" --json
          find . -type f \( -name '*-plugin-product.tar.zst' -o -name '*.manifest.json' -o -name '*.sbom.spdx.json' \) \
            -exec cp {} release-stage/ \;
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md \
            third_party/laz-perf/COPYING \
            docs/reference/CAPABILITY_MATRIX.md \
            docs/compatibility/OPENUSD.md \
            docs/guides/INSTALL.md release-stage/
          test -f release-stage/LICENSE
          test -f release-stage/NOTICE
          test -f release-stage/THIRD_PARTY_NOTICES.md
          test -f release-stage/COPYING
          test -f release-stage/CAPABILITY_MATRIX.md
          test -f release-stage/OPENUSD.md
          test -f release-stage/INSTALL.md
          test -n "$(find release-stage -type f -print -quit)"
          ls -la release-stage

      - name: Upload platform release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release-stage/
          if-no-files-found: error

  release:
    name: Assemble draft release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release version
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          version="$(tr -d '[:space:]' < VERSION)"
          test "$tag" = "v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true

      - name: Add source archive and checksums
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git archive --format=tar.gz \
            --prefix="usd-pointcloud-plugins-${VERSION}/" \
            -o "dist-release/usd-pointcloud-plugins-${VERSION}-src.tar.gz" "$TAG"
          cd dist-release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
          cp "../docs/releases/v${VERSION}.md" RELEASE_NOTES.md
          {
            echo
            echo '## Artifacts'
            echo
            echo '| File | Description |'
            echo '| --- | --- |'
            while IFS= read -r file; do
              printf '| `%s` | Platform plugin or source release asset |\n' "$file"
            done < <(find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name RELEASE_NOTES.md -printf '%P\n' | LC_ALL=C sort)
            echo '| `SHA256SUMS` | SHA-256 checksums for all release artifacts |'
            echo
            echo '## SHA-256 checksums'
            echo
            echo '```text'
            cat SHA256SUMS
            echo '```'
          } >> RELEASE_NOTES.md

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft > existing.json 2>/dev/null; then
            if [ "$(jq -r .isDraft existing.json)" = true ]; then
              gh release delete "$TAG" --yes
            else
              echo "Release $TAG is already published; refusing to replace it" >&2
              exit 1
            fi
          fi
          gh release create "$TAG" --draft \
            --title "$TAG" \
            --notes-file dist-release/RELEASE_NOTES.md \
            dist-release/*
