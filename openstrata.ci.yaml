  # Workspace cells: the Tier 1 resolver contract gate.
  #
  # Every bundle cell above is a per-plugin build rooted at
  # plugins/pointcloud-<x>/CMakeLists.txt, a standalone project() that never
  # declares USDGEO_BUILD_TESTS. The option is undefined there, so neither
  # pointcloudCopc_tests nor the memory-backed resolver test double under
  # tests/plugins/httpresolver is compiled by a bundle cell. Only the root
  # CMakeLists.txt defaults USDGEO_BUILD_TESTS to ON, which is what a
  # `kind: workspace` cell configures through `ost build` before running the
  # CTest suite. These cells are therefore what makes Tier 1 a CI gate rather
  # than a local-only one, and they need no external resolver repository.

  - name: workspace-pr-windows
    lane: pull_request
    runner: windows-hosted
    kind: workspace
    verify: test
    runtime_artifact: sha256:ebb0c7da509ee14ada19ee5b461de6996aad0024b5c9640f12dde76912e849b5
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:d3ff79a6f330558c3b9a427a927d340fe3dcab1fe89107faa0ea9f66a104b7bf
      expected_oci_digest: sha256:d3ff79a6f330558c3b9a427a927d340fe3dcab1fe89107faa0ea9f66a104b7bf
    platform: cy2026
    profile: usd

  - name: workspace-pr-macos-arm64
    lane: pull_request
    runner: macos-arm64-hosted
