# OpenStrata CI support matrix for usd-pointcloud-plugins.
#
# This file is the CI contract. Regenerate .github/workflows/ost-*.yml with
# `ost ci generate github` after changing it. Do not hand-edit CI semantics in
# the generated workflow YAML: every host requirement is declared here as
# `host_packages`, so regeneration re-renders the step instead of dropping a
# hand-added one.
#
#   LINUX HOST DEPS. Two runtime CMake exports reach out to system libraries
#   that a bare ubuntu-24.04 runner does not carry, so every Linux cell declares
#   them under `host_packages.apt`:
#
#     libx11-dev, libxt-dev, libxext-dev  OpenUSD 26.08's MaterialX 1.39.5
#       exports an unconditional `find_dependency(X11 REQUIRED COMPONENTS Xt)` on
#       non-Apple UNIX, so a consumer cannot even configure — `ost runtime
#       validate` fails its `consumer-configure` check — without X11 dev headers.
#       Separately, the runtime's `garch` target hardcodes the absolute paths it
#       was built against: libX11.so, libSM.so, libICE.so and libXext.so. SM and
#       ICE arrive with libxt-dev, but libXext.so needs libxext-dev explicitly or
#       the link fails with "missing and no known rule to make it". That list is
#       the complete set of absolute system libraries baked into the runtime's
#       CMake exports; libpython3.13.so also appears, but only as a Python3_LIBRARY
#       hint that setup-python's toolcache overrides.
#
#     libgl1-mesa-dev  the runtime's `garch` target carries `OpenGL::GL` in its
#       INTERFACE_LINK_LIBRARIES, which is why each bundle's CMakeLists issues
#       `find_package(OpenGL REQUIRED)`. Without the dev package that find fails
#       on OPENGL_opengl_LIBRARY / OPENGL_glx_LIBRARY / OPENGL_INCLUDE_DIR.
#       macOS needs no equivalent: the OpenGL framework ships with the SDK.
#
# Digest provenance:
#   All three runtimes are the validated OpenUSD 26.08 (PXR_VERSION 2608) builds
#   published by animu-sphere, and are the same artifacts usd-vrm-plugins pins.
#   Each carries an SPDX SBOM and SLSA/in-toto provenance, which is what the
#   `--require-sbom --require-provenance` gate `ost ci generate` renders demands.
#
#   DO NOT re-pin from the moving `26.08-<platform>` GHCR tags. Those tags point
#   at a separate runtime build configured WITH Vulkan, whose `pxrTargets.cmake`
#   puts `Vulkan::Vulkan` in the `hgiVulkan` link interface while `pxrConfig.cmake`
#   never issues a matching `find_dependency(Vulkan)`. Consuming it fails at the
#   CMake generate step with "the link interface of target hgiVulkan contains:
#   Vulkan::Vulkan but the target was not found" on every platform.
#
#   The OCI manifest digest is NOT stable across republishes (provenance embeds
#   the producing commit), so `expected_oci_digest` must be re-pinned from the
#   push output every time, while `runtime_artifact` stays put.
#     Windows: OST artifact sha256:c3ed4012... / OCI sha256:07cb8441...
#     macOS:   OST artifact sha256:a9bb847a... / OCI sha256:dc0c980b...
#     Linux:   OST artifact sha256:03f7d4ef... / OCI sha256:367a32bd...
schema: 1

bootstrap:
  ost:
    version: "0.22.7"
    repository: animu-sphere/open-strata

runners:
  windows-hosted:
    kind: github-hosted
    image: windows-2022
    billing:
      acknowledgement: required
  macos-arm64-hosted:
    kind: github-hosted
    image: macos-15
    billing:
      acknowledgement: required
  linux-hosted:
    kind: github-hosted
    image: ubuntu-24.04
    billing:
      acknowledgement: required

