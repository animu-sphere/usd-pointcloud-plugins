# OpenStrata CI support matrix for usd-pointcloud-plugins.
#
# This file is the CI contract. Regenerate .github/workflows/ost-*.yml with
# `ost ci generate github` after changing it. Do not hand-edit CI semantics in
# the generated workflow YAML: every host requirement is declared here as
# `host_packages`, so regeneration re-renders the step instead of dropping a
# hand-added one.
#
#   LINUX HOST DEPS. Two runtime CMake exports reach out to system libraries
#   that a bare ubuntu-24.04 runner does not carry, so every Linux cell declares
#   them under `host_packages.apt`:
#
#     libx11-dev, libxt-dev, libxext-dev  OpenUSD 26.08's MaterialX 1.39.5
#       exports an unconditional `find_dependency(X11 REQUIRED COMPONENTS Xt)` on
#       non-Apple UNIX, so a consumer cannot even configure — `ost runtime
#       validate` fails its `consumer-configure` check — without X11 dev headers.
#       Separately, the runtime's `garch` target hardcodes the absolute paths it
#       was built against: libX11.so, libSM.so, libICE.so and libXext.so. SM and
#       ICE arrive with libxt-dev, but libXext.so needs libxext-dev explicitly or
#       the link fails with "missing and no known rule to make it". That list is
#       the complete set of absolute system libraries baked into the runtime's
#       CMake exports; libpython3.13.so also appears, but only as a Python3_LIBRARY
#       hint that setup-python's toolcache overrides.
#
#     libgl1-mesa-dev  the runtime's `garch` target carries `OpenGL::GL` in its
#       INTERFACE_LINK_LIBRARIES, which is why each bundle's CMakeLists issues
#       `find_package(OpenGL REQUIRED)`. Without the dev package that find fails
#       on OPENGL_opengl_LIBRARY / OPENGL_glx_LIBRARY / OPENGL_INCLUDE_DIR.
#       macOS needs no equivalent: the OpenGL framework ships with the SDK.
#
# Digest provenance:
#   All three runtimes are the validated OpenUSD 26.08 (PXR_VERSION 2608)
#   imaging leaves of ost's canonical runtime matrix, published by animu-sphere,
#   and are the same artifacts usd-vrm-plugins and usd-3dgs-plugins pin. Each
#   carries an SPDX SBOM and SLSA/in-toto provenance, which is what the
#   `--require-sbom --require-provenance` gate `ost ci generate` renders demands.
#
#     Windows: leaf 26.08-gl-windows-x86_64
#              OST artifact sha256:ebb0c7da... / OCI sha256:d3ff79a6...
#     macOS:   leaf 26.08-metal-macos-arm64
#              OST artifact sha256:8d132212... / OCI sha256:8486d942...
#     Linux:   leaf 26.08-gl-linux-x86_64
#              OST artifact sha256:3bf31789... / OCI sha256:8d2d5994...
#
#   Rechecked 2026-11-03 for the ost 0.23.19 bootstrap: the registry still
#   serves each leaf tag at the OCI digest pinned below, and 26.08 is still the
#   newest version in ost's runtime matrix, so no cell is re-pinned.
#
#   DO NOT re-pin from the legacy `26.08-<platform>` GHCR tags (no variant).
#   Those pointed at a runtime build configured WITH Vulkan, whose
#   `pxrTargets.cmake` puts `Vulkan::Vulkan` in the `hgiVulkan` link interface
#   while `pxrConfig.cmake` never issues a matching `find_dependency(Vulkan)`.
#   Consuming it fails at the CMake generate step with "the link interface of
#   target hgiVulkan contains: Vulkan::Vulkan but the target was not found".
#   Re-pin only from the `<version>-<variant>-<os>-<arch>` leaves above.
#
#   Neither the OCI manifest digest nor `runtime_artifact` is stable across a
#   republish (provenance embeds the producing commit): re-pin both from the
#   producer's push output, and check ost's support/runtime-migrations.json for
#   a recorded replacement when a pinned digest stops resolving.
#
#   WINDOWS HOST PYTHON. ost 0.23.x `runtime validate` links and runs a C++
#   consumer (`consumer-link`). The Windows runtime bundles no interpreter and
#   its USD DLLs import python313.dll, so without a host Python on PATH that
#   consumer exits 0xC0000135 (DLL not found). Every Windows cell therefore
#   declares host_python "3.13", as the Linux and macOS cells already did;
#   usd-vrm-plugins and usd-3dgs-plugins measured this on the same digest.
schema: 1

bootstrap:
  ost:
    version: "0.23.19"
    repository: animu-sphere/open-strata

runners:
  windows-hosted:
    kind: github-hosted
    image: windows-2022
    billing:
      acknowledgement: required
  macos-arm64-hosted:
    kind: github-hosted
    image: macos-15
    billing:
      acknowledgement: required
  linux-hosted:
    kind: github-hosted
    image: ubuntu-24.04
    billing:
      acknowledgement: required

cells:
  # Main validates each plugin's standalone bundle boundary on every host.
  - name: pointcloud-las-main-windows
    lane: main
    runner: windows-hosted
    runtime_artifact: sha256:ebb0c7da509ee14ada19ee5b461de6996aad0024b5c9640f12dde76912e849b5
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:d3ff79a6f330558c3b9a427a927d340fe3dcab1fe89107faa0ea9f66a104b7bf
      expected_oci_digest: sha256:d3ff79a6f330558c3b9a427a927d340fe3dcab1fe89107faa0ea9f66a104b7bf
    bundle: plugins/pointcloud-las
    platform: cy2026
    profile: usd
    host_python: "3.13"
    up_to: 4

